# SPDX-License-Identifier: Apache-2.0
name: Stage 2 activation composition
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stage2-activation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  activation:
    name: Five-service activation and lost-response recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: activation_test
          POSTGRES_PASSWORD: activation-local-only
          POSTGRES_DB: activation_server
        ports: ["5434:5432"]
        options: >-
          --memory 768m --cpus 2
          --health-cmd "pg_isready -U activation_test -d activation_server"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MUNARIUM_PLATFORM_TEST_DATABASE_URL: postgres://activation_test:activation-local-only@127.0.0.1:5434/activation_server
      STAGE2_GATE_DATABASE_URL: postgres://activation_test:activation-local-only@127.0.0.1:5434/activation_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: munarium-harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iokaio/munarium
          ref: 7d4a4d836fb483e7dad056f167f3a965d793d229 # Merged Server participant
          path: munarium
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iokaio/munarium-council
          ref: 24babfd88991386d6e850dfe7db013155bfc9beb # Council approval custody
          path: munarium-council
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iokaio/munarium-registry
          ref: 243709c6da9f3d77051d19c3535e33d1e4dae226 # Merged Registry delivery
          path: munarium-registry
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iokaio/munarium-gate
          ref: 0b4be9c28c7a5fa5eff5d70eb8256aecb559c8ae # Merged dynamic Gate service and native evaluator
          path: munarium-gate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iokaio/munarium-warden
          ref: fa6951ffdd83c74c0699ca217351562b2da28e5b # Warden live grants/custody
          path: munarium-warden
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned compiler
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            munarium/server
            munarium-council
            munarium-registry
            munarium-gate
            munarium-warden
      - name: Build exact component revisions
        run: |
          cargo +1.98.1 build --locked --manifest-path munarium/server/Cargo.toml -p munarium-server
          for repo in munarium-council munarium-registry munarium-gate munarium-warden; do
            cargo +1.98.1 build --locked --manifest-path "$repo/Cargo.toml"
          done
          python -m pip install -e './munarium/clients/python[dev,platform-test]'
      - name: Create isolated Gate database
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$DATABASE_CONTAINER" createdb -U activation_test activation_gate
      - name: Exercise and retain actual activation history
        working-directory: munarium-harness
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          image=$(docker inspect --format '{{.Image}}' "$DATABASE_CONTAINER")
          python scripts/run_activation.py --workspace .. --output target/activation.json --owner github-actions-disposable-cell --database-image "$image"
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-activation-evidence
          path: |
            munarium-harness/target/activation.json
            munarium-harness/target/activation.log
          if-no-files-found: warn
      - name: Actual agent container isolation and governed prepared effects
        working-directory: munarium-harness
        env:
          STAGE2_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          image=$(docker inspect --format '{{.Image}}' "$STAGE2_DATABASE_CONTAINER")
          python scripts/run_activation.py --workspace .. --output target/isolation.json --owner github-actions-disposable-cell --database-image "$image" --execution --isolation
      - name: Retain sanitized agent isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-agent-isolation-evidence
          path: |
            munarium-harness/target/isolation.json
            munarium-harness/target/isolation.log
            munarium-harness/target/isolation.agent.jsonl
          if-no-files-found: warn
      - name: Live prepared release, lost replies and PostgreSQL restore
        working-directory: munarium-harness
        env:
          STAGE2_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          image=$(docker inspect --format '{{.Image}}' "$STAGE2_DATABASE_CONTAINER")
          python scripts/run_activation.py --workspace .. --output target/execution.json --owner github-actions-disposable-cell --database-image "$image" --execution
      - name: Retain sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-execution-evidence
          path: |
            munarium-harness/target/execution.json
            munarium-harness/target/execution.log
          if-no-files-found: warn
      - name: Fetch pinned Linux evaluator and delegate owned subtree
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static -o munarium-gate/target/opa-linux
          echo '668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031  munarium-gate/target/opa-linux' | sha256sum -c -
          chmod 755 munarium-gate/target/opa-linux
          root="/sys/fs/cgroup/munarium-dynamic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$root"
          echo '+cpu +memory +pids' | sudo tee "$root/cgroup.subtree_control" >/dev/null
          sudo mkdir "$root/supervisor"
          sudo chown "$(id -u):$(id -g)" "$root" "$root/cgroup.procs" "$root/cgroup.subtree_control" "$root/cgroup.threads"
          echo "MUNARIUM_OPA_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Native dynamic proposals from isolated agent through five real services
        working-directory: munarium-harness
        env:
          STAGE2_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
          OPA_LINUX_EXECUTABLE: ${{ github.workspace }}/munarium-gate/target/opa-linux
        run: |
          image=$(docker inspect --format '{{.Image}}' "$STAGE2_DATABASE_CONTAINER")
          sudo --preserve-env=MUNARIUM_OPA_CGROUP_ROOT,OPA_LINUX_EXECUTABLE,MUNARIUM_PLATFORM_TEST_DATABASE_URL,STAGE2_GATE_DATABASE_URL,STAGE2_DATABASE_CONTAINER,PATH sh -c 'echo $$ > "$1/supervisor/cgroup.procs"; owner="$2"; shift 2; exec runuser -u "$owner" -- "$@"' sh "$MUNARIUM_OPA_CGROUP_ROOT" "$(id -un)" python scripts/run_activation.py --workspace .. --output target/dynamic.json --owner github-actions-disposable-cell --database-image "$image" --execution --isolation --dynamic
      - name: Retain sanitized dynamic composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-dynamic-isolation-evidence
          path: |
            munarium-harness/target/dynamic.json
            munarium-harness/target/dynamic.log
            munarium-harness/target/dynamic.agent.jsonl
          if-no-files-found: warn
      - name: Remove only the owned dynamic evaluator subtree
        if: always()
        run: |
          root="/sys/fs/cgroup/munarium-dynamic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$root" ]; then
            sudo sh -c 'echo 1 > "$1/cgroup.kill"' sh "$root"
            sudo find "$root" -mindepth 1 -depth -type d -exec rmdir {} +
            sudo rmdir "$root"
          fi
