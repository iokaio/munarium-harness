# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-harness"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Client-side proposal building, typed outcome retrieval, and refusal diagnostics."
repository = "https://github.com/iokaio/munarium-harness"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
